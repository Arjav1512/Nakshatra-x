services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: moil
      POSTGRES_USER: moil_user
      POSTGRES_PASSWORD: change_this_in_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  # Planned, not installed: the Celery worker queue in
  # SIH26009-Architecture.excalidraw. No code connects to Redis yet.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
