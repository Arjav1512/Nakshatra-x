[pytest]
# A test that runs longer than this gets every thread's stack dumped to stderr
# by pytest's faulthandler plugin, and keeps running. One full run of the
# backend suite once produced no output and had to be stopped (PR #28); there
# was nothing to show where it was. This makes the next one show it, locally
# and in CI, before anything kills it: 900 s is above the slowest test on a CI
# runner (the Track B backtest, ~9 min) and below the backend and Track B job
# timeouts (20 and 30 min). A dump is a flaky test to root-cause, not to rerun.
faulthandler_timeout = 900
